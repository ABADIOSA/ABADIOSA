name: Build installers

# Every push to a working branch leaves a downloadable build in the Actions tab.
# A GitHub Release — which is where the app's own updater looks — is produced
# either by pushing a version tag, or by running this workflow by hand with
# "Publish a release" ticked. electron-builder creates the tag and the release
# itself from the version in package.json, so the tag need not exist first.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release for the version in package.json'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # A release must be anchored to a tag that already points at this commit.
  # Left to itself, electron-builder creates the release without naming a target,
  # so GitHub anchors the new tag to the repository's DEFAULT branch — which in a
  # repository holding several projects is somebody else's code. Creating the tag
  # here first means GitHub reuses it and the release points at what was built.
  tag:
    name: Tag the commit
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the version tag if it does not exist
        id: tag
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists — bump the version in package.json"
            exit 1
          fi

          # An annotated tag records a tagger, and a fresh runner has no identity.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git tag -a "v$version" -m "Cinema Hall $version"
          git push origin "v$version"
          echo "tagged v$version at $(git rev-parse --short HEAD)"

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: [tag]
    # `tag` only runs for a manual publish; a plain branch build skips it.
    if: ${{ always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    env:
      PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            target: win
            artifact: CinemaHall-windows
            files: release/*.exe
          - os: macos-latest
            label: macOS
            target: mac
            artifact: CinemaHall-macos
            files: release/*.dmg
          - os: ubuntu-latest
            label: Linux
            target: linux
            artifact: CinemaHall-linux
            files: |
              release/*.AppImage
              release/*.deb

    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch the tag the job above just pushed, so the build is anchored
          # to it rather than to a bare branch head.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # mpv is the app's playback engine; installing it here means the engine
      # tests run for real on this platform instead of skipping.
      - name: Install mpv
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv

      - name: Run tests
        run: npm test

      - name: Build installer
        if: env.PUBLISH != 'true'
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build and publish release
        if: env.PUBLISH == 'true'
        run: npm run release:${{ matrix.target }}
        env:
          # No Apple Developer certificate in CI — build unsigned rather than
          # failing on a missing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
