name: بناء TempMailWin.exe

on:
  push:
    branches: ["claude/windows-temp-email-app-mtx1oq", "main"]
    tags: ["v*"]
  # زر تشغيل يدوي من تبويب Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # الاختبارات تعمل بلا إنترنت وبلا اعتماديات
  test:
    name: الاختبارات
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تشغيل الاختبارات
        run: python -m unittest discover -s tests -t . -v

  build:
    name: بناء ملف EXE
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت أدوات البناء
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: البناء
        run: python scripts/build.py

      - name: التأكد من وجود الملف
        shell: pwsh
        run: |
          if (-not (Test-Path dist/TempMailWin.exe)) {
            Write-Error "لم يُنتج ملف EXE"
            exit 1
          }
          $size = (Get-Item dist/TempMailWin.exe).Length / 1MB
          Write-Host ("تم البناء: {0:N1} ميجابايت" -f $size)

      # فحص دخان: يشتغل الملف ويردّ على الطلبات ثم يُغلق
      - name: فحص تشغيل سريع
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist/TempMailWin.exe `
                   -ArgumentList "--port","8791","--no-open" -PassThru
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:8791/" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200 -and $r.Content -match 'id="app"') { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { Write-Error "التطبيق لم يستجب"; exit 1 }
            Write-Host "التطبيق يعمل ويقدّم الواجهة."
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: رفع الملف كمُخرَج
        uses: actions/upload-artifact@v4
        with:
          name: TempMailWin-windows
          path: dist/TempMailWin.exe
          retention-days: 90
          if-no-files-found: error

      # عند دفع وسم مثل v1.0.0 يُنشأ إصدار فيه الملف للتحميل المباشر
      - name: نشر إصدار
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TempMailWin.exe
          generate_release_notes: true
