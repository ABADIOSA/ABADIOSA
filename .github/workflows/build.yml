name: Build installers

# Every push to a working branch leaves a downloadable build in the Actions tab.
# Pushing a version tag (git tag v1.1.0 && git push origin v1.1.0) publishes a
# GitHub Release instead — which is also where the app's own updater looks.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            target: win
            artifact: CinemaHall-windows
            files: release/*.exe
          - os: macos-latest
            label: macOS
            target: mac
            artifact: CinemaHall-macos
            files: release/*.dmg
          - os: ubuntu-latest
            label: Linux
            target: linux
            artifact: CinemaHall-linux
            files: |
              release/*.AppImage
              release/*.deb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # mpv is the app's playback engine; installing it here means the engine
      # tests run for real on this platform instead of skipping.
      - name: Install mpv
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mpv

      - name: Run tests
        run: npm test

      - name: Build installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:${{ matrix.target }}
        env:
          # No Apple Developer certificate in CI — build unsigned rather than
          # failing on a missing identity.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
