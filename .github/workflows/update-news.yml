name: تحديث الأخبار تلقائيًا

on:
  schedule:
    # كل 3 ساعات
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تحديث ملف الأخبار
        run: python scripts/update_news.py

      - name: رفع التحديث إن وُجد
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/news.json; then
            git add data/news.json
            git commit -m "تحديث تلقائي للأخبار $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "لا توجد أخبار جديدة."
          fi
