name: Release

# يُطلق بدفع وسم نسخة، مثل:  git tag v1.8.0 && git push origin v1.8.0
# يبني الحزمتين من الكود الموسوم نفسه، يوقّع نسخة فايرفوكس عبر AMO إن
# توفّرت المفاتيح، وينشر إصداراً على GitHub. ثم — إن كان الكود موجوداً
# على main — يحدّث updates/updates.json هناك ليلتقطه فايرفوكس ويحدّث
# الإضافة عند المستخدمين تلقائياً.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # نمرّرها إلى البيئة لأن سياق secrets غير متاح في شرط if للخطوة
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      # الافتراضي يجلب المرجع الذي أطلق التشغيل — أي الوسم نفسه،
      # فنبني بالضبط ما وُسم لا ما على main.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تحقّق من تطابق الوسم مع نسخة المانيفست
        id: version
        run: |
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$MANIFEST" ]; then
              echo "::error::الوسم v$TAG لا يطابق نسخة المانيفست $MANIFEST"
              exit 1
            fi
          fi
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: بناء الحزم وبيانات التحديث
        run: node scripts/build.mjs --manifests

      # التوقيع اختياري: بدونه يصدر الإصدار بالحزم المضغوطة فقط،
      # ومع المفاتيح يصدر XPI موقّعاً يحدّثه فايرفوكس تلقائياً.
      - name: توقيع نسخة فايرفوكس (AMO)
        id: sign
        if: env.AMO_JWT_ISSUER != ''
        run: |
          npm install --no-save web-ext
          npx web-ext sign \
            --source-dir=extension-firefox \
            --artifacts-dir=dist \
            --channel=unlisted \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET"
          # web-ext يسمّي الملف بمعرّف الإضافة؛ نوحّد الاسم مع update_link
          XPI=$(find dist -name '*.xpi' | head -1)
          if [ -n "$XPI" ]; then
            mv "$XPI" "dist/stremiohub-harbor-${{ steps.version.outputs.version }}.xpi"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: نشر الإصدار
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: .github/release-notes/v${{ steps.version.outputs.version }}.md
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.xpi

  # فايرفوكس يقرأ updates.json من main، فلا بد أن يشير إلى أحدث إصدار.
  # يُتخطّى بهدوء ما دام الكود لم يُدمج في main بعد.
  sync-update-manifest:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تحديث بيان التحديث على main
        run: |
          if [ ! -f scripts/build.mjs ]; then
            echo "::notice::main لا يحتوي على الكود بعد — تخطّي تحديث بيان التحديث"
            exit 0
          fi
          node scripts/build.mjs --manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates/updates.json updates/updates.xml
          if git diff --cached --quiet; then
            echo "لا تغيير في بيانات التحديث"
          else
            git commit -m "تحديث بيان التحديث إلى ${GITHUB_REF_NAME}"
            git push origin main
          fi
