<title>Cinema Hall</title>
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/cinema.css" />

<div id="stage" data-mode="boot">
  <!-- Auditorium furniture: always painted, never interactive -->
  <div class="house-light" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="curtain" id="curtain" aria-hidden="true">
    <div class="curtain__panel curtain__panel--left"></div>
    <div class="curtain__panel curtain__panel--right"></div>
    <div class="curtain__valance"></div>
  </div>

  <main id="views"></main>

  <div class="marquee-clock" id="houseClock" aria-hidden="true">
    <span class="marquee-clock__name" id="houseName">CINEMA HALL</span>
    <span class="marquee-clock__time" id="houseTime">--:--</span>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="boot" id="boot"><div class="boot__reel"></div><p class="boot__text">تشغيل دار العرض…</p></div>
</div>
